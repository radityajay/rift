name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Build
        run: CGO_ENABLED=0 go build -o bin/rift ./cmd/rift

      - name: Test
        run: go test ./... -v -timeout 60s

      - name: Verify binary
        run: ./bin/rift --help
